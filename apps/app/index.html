<!doctype html>
<html lang="ru" data-client="game">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PIXEL BATTLE · Пиксель Батл %Y_S_E%</title>
    <base data-trunk-public-url/>
    <meta name="site-base" content="">
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-initializer="web/initializer.js">
    <link data-trunk rel="copy-file" href="web/bridge.js">
    <link data-trunk rel="copy-file" href="web/chat-font.mjs">
    <link data-trunk rel="copy-file" href="../../assets/fonts/NotoSansJP.ttf">
    <link data-trunk rel="copy-file" href="../../assets/fonts/NotoColorEmoji.ttf">
    <link data-trunk rel="copy-file" href="web/timelapse.js">
    <link data-trunk rel="copy-file" href="../../assets/eye-dropper.png">
    <link data-trunk rel="copy-file" href="generated/palette.json">
    <script>
        const siteBase = document.querySelector('meta[name="site-base"]').content || new URL(document.baseURI).pathname;
        document.documentElement.dataset.siteBase = siteBase;
        const sitePath = location.pathname.startsWith(siteBase) ? '/' + location.pathname.slice(siteBase.length) : location.pathname;
        document.documentElement.dataset.client = /^\/timelapse(?:\/|$)/.test(sitePath) ? 'timelapse' : /^\/tg(?:\/|$)/.test(sitePath) ? 'telegram' : 'game';
    </script>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9d7ff; }
        canvas { width: 100%; height: 100%; outline: none; touch-action: none; }
        canvas[data-field-cursor="pointer"] { cursor: pointer !important; }
        canvas[data-field-cursor="crosshair"] { cursor: crosshair !important; }
        canvas[data-field-cursor="pick"] { cursor: url("eye-dropper.png") 9 22, crosshair !important; }
        [hidden] { display: none !important; }
        #fallback { padding: 1rem; font: 1rem system-ui; }
    </style>
    <script>
        const telegramStartup = (() => {
            const route = document.documentElement.dataset.client;
            const existing = window.Telegram?.WebApp;
            const hash = new URLSearchParams(location.hash.slice(1));
            const enabled = route !== 'timelapse' && (route === 'telegram' || location.hostname.startsWith('tg.')
                || hash.has('tgWebAppData') || Boolean(existing?.initData));
            if (!enabled || existing) return { enabled, sdk: Promise.resolve(existing) };

            const sdk = new Promise(resolve => {
                const script = document.createElement('script');
                script.src = 'https://telegram.org/js/telegram-web-app.js';
                script.onload = () => resolve(window.Telegram?.WebApp);
                script.onerror = () => resolve(undefined);
                document.head.append(script);
            });
            return { enabled, sdk };
        })();
    </script>
</head>
<body>
    <canvas id="canvas" tabindex="0" aria-label="Пиксель Батл"></canvas>
    <div id="fallback" hidden>Не удалось запустить Slint. <button type="button" onclick="location.reload()">Повторить</button></div>
    <script>
        addEventListener('TrunkApplicationStarted', async () => {
            try {
                const { boot } = await import(new URL('bridge.js', document.baseURI));
                await boot(() => Promise.resolve(), window.wasmBindings.Client,
                    fetch(new URL('palette.json', document.baseURI)).catch(() => null), telegramStartup);
            } catch (error) {
                console.error(error);
                document.querySelector('#canvas').hidden = true;
                document.querySelector('#fallback').hidden = false;
            }
        });
    </script>
</body>
</html>
