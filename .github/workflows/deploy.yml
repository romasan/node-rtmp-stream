name: Build and Deploy
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install
        run: |
          npm install

      # Порог для production-дерева — high: единственная moderate-находка (`uuid <11.1.1`,
      # GHSA-w5hq-g745-h8pq) неприменима — проект использует только v4, уязвимость в v3/v5/v6 с `buf`.
      # Обновиться до patched `uuid` нельзя: `uuid@11+` содержит синтаксис ES2021 (`??`, `?.`),
      # который не парсит Chromium 78 внутри react-snap (см. README, раздел про зависимости).
      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Build
        run: |
          npm run build

      - name: Rect Snap
        run: |
          npm run render

      - name: Deploy
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: dist
          CLEAN: true