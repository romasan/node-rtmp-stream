[package]
name = "pixelbattle-slint"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.18"
prost = "0.14"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "=1.16.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
i-slint-backend-winit = { version = "=1.16.0", default-features = false, features = ["renderer-femtovg"] }

[build-dependencies]
slint-build = "=1.16.0"

[profile.release]
lto = true
opt-level = "z"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
